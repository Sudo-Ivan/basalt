afterPack: meta/flipFuses.js
appId: io.quad4.basalt
productName: Basalt
files:
  - build/**/*
  - node_modules/**/*
  - '!build/bin/*'
  - build/bin/legendary.LICENSE

asarUnpack:
  - build/icon.png
  - build/icon.icns
  - build/mac-icon.icns
  - build/win_icon.ico
  - build/icon-dark.png
  - build/icon-light.png
  - build/bin/**/*
  - '!build/bin/legendary.LICENSE'
  - build/preload/webviewPreload.js

protocols:
  - name: heroic
    schemes:
      - heroic

# Auto-update feed for electron-updater, served from this fork's GitHub
# releases over HTTPS only. Update metadata (latest.yml, latest-mac.yml,
# latest-linux.yml) is published with sha512 checksums.
# NOTE: the released packages are unsigned, so on Windows and macOS the
# updater can only verify a downloaded update against the sha512 checksum
# published in the release metadata over HTTPS. There is no codesigning
# based verification. On Linux the AppImage uses the same metadata, and
# the zip targets feed the macOS updater.
publish:
  provider: github
  owner: Sudo-Ivan
  repo: basalt
  private: false
  releaseType: release

win:
  artifactName: ${productName}-${version}-Setup-${arch}.${ext}
  icon: build/win_icon.ico
  target:
    - nsis
    - portable
  files:
    - build/bin/${arch}/win32/*
    - build/bin/x64/win32/nile.exe
    - build/bin/x64/win32/GalaxyCommunication.exe
    - build/bin/x64/win32/EpicGamesLauncher.exe

portable:
  artifactName: ${productName}-${version}-Portable-${arch}.${ext}

mac:
  artifactName: ${productName}-${version}-macOS-${arch}.${ext}
  category: public.app-category.games
  icon: build/mac-icon.icns
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    com.apple.security.cs.allow-jit: true
  files:
    - build/bin/${arch}/darwin/*
    - build/bin/x64/win32/GalaxyCommunication.exe
    - build/bin/x64/win32/EpicGamesLauncher.exe

dmg:
  background: public/dmg.png
  window:
    width: 600
    height: 500
  contents:
    - x: 10
      y: 215
      type: file
    - x: 420
      y: 215
      type: link
      path: /Applications

linux:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  category: Game
  icon: build/icon.png
  desktop:
    entry:
      Name: Basalt
      Comment[de]: Ein OSS-Spielelauncher für GOG, Epic Games und Amazon Games
      Comment[pl]: Otwartoźródłowy launcher dla GOG, Epic Games i Amazon Games
      Comment[fr]: Un lanceur de jeux open source pour GOG, Epic Games et Amazon Games
      Comment[es]: Un lanzador de juegos de código abierto para GOG, Epic Games
      Comment[it]: Un launcher open source per GOG, Epic Games e Amazon Games
      Comment[ru]: Открытый игровой лаунчер для GOG, Epic Games и Amazon Games
      Comment[zh_CN]: 一个用于GOG、Epic Games和Amazon Games的开源游戏启动器
      Comment[pt]: Um lançador de jogos de código aberto para GOG, Epic Games e Amazon Games
      Comment[pt_BR]: Um lançador de jogos de código aberto para GOG, Epic Games e Amazon Games
      Comment[ja]: GOG、Epic Games、Amazon Gamesのためのオープンソースランチャー
      Comment: An Open Source Launcher for GOG, Epic Games and Amazon Games
  files:
    - build/bin/${arch}/linux/*
    - build/bin/x64/win32/GalaxyCommunication.exe
    - build/bin/x64/win32/EpicGamesLauncher.exe

rpm:
  fpm: ['--rpm-rpmbuild-define', '_build_id_links none']

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
