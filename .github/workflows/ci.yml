name: CI

# Lint, typecheck, unit tests and a production build on every push to master.
permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/install-deps
      - name: Type check
        run: pnpm codecheck
      - name: Lint
        run: pnpm lint
      - name: Prettier
        run: pnpm prettier
      - name: Unit tests
        run: pnpm test:ci

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/install-deps
      - name: Build
        run: pnpm build
