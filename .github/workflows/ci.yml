name: CI

# Lint, typecheck, unit tests and a production build on every push to master.
permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/install-deps
      - name: Type check
        run: pnpm codecheck
      - name: Lint
        run: pnpm lint
      - name: Prettier
        run: pnpm prettier
      - name: Unit tests
        run: pnpm test:ci

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/install-deps
      - name: Build
        run: pnpm build
