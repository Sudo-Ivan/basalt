patchedDependencies:
  '@types/node@22.20.5': patches/@types__node@22.20.5.patch

nodeLinker: hoisted

minimumReleaseAge: 1440

blockExoticSubdeps: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - 'semver@5.7.2'
  - 'semver@6.3.1'
  - 'undici-types@6.21.0'

strictDepBuilds: true

verifyDepsBeforeRun: warn

overrides:
  ts-morph: 17.0.1

allowBuilds:
  '@fortawesome/fontawesome-common-types': true
  '@fortawesome/fontawesome-svg-core': true
  '@fortawesome/free-brands-svg-icons': true
  '@fortawesome/free-regular-svg-icons': true
  '@fortawesome/free-solid-svg-icons': true
  '@parcel/watcher': true
  '@swc/core': true
  electron: true
  electron-winstaller: true
  esbuild: true
  register-scheme: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@xhayper/discord-rpc@1.5.1'
